name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PROJECT_DIR: online-reader-demo

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Configuration
        id: config
        run: |
          if grep -q "enable_unit_test: true" ci-config.yml; then
            echo "enable_unit_test=true" >> $GITHUB_OUTPUT
          else
            echo "enable_unit_test=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "enable_lint: true" ci-config.yml; then
            echo "enable_lint=true" >> $GITHUB_OUTPUT
          else
            echo "enable_lint=false" >> $GITHUB_OUTPUT
          fi

  # （可选）Lint job，先按你配置的 enable_lint 决定要不要跑
  lint:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_lint == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Dependencies
        run: make deps
      - name: Run Lint
        run: make lint

  # ============================
  # 3. 核心测试任务（E2E + Allure）
  # ============================
  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reader_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 1) 安装依赖
      - name: Install Dependencies (make deps)
        run: make deps

      # 2) 启动后端 + 前端 + 等待端口
      - name: Start Services (backend & frontend)
        run: make start-deps

      # 3) 跑 E2E 测试（pytest + Allure）
      - name: Run E2E Tests
        run: make test

      # 失败时打印日志（额外兜底，虽然 start-deps 已经会打印一次）
      - name: Debug - Print Logs on Failure
        if: failure()
        run: |
          echo "============= BACKEND LOG ============="
          cat backend/backend.log || true
          echo ""
          echo "============= FRONTEND LOG ============="
          cat frontend/frontend.log || true

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
