name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PROJECT_DIR: online-reader-demo

jobs:
  # 1) 预检查：从 ci-config.yml 里读开关
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
      enable_contract_test: ${{ steps.config.outputs.enable_contract_test }}
      enable_coverage: ${{ steps.config.outputs.enable_coverage }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Read Configuration
        id: config
        run: |
          set -e

          # unit test 开关
          if grep -q "enable_unit_test: true" ci-config.yml; then
            echo "enable_unit_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable_unit_test=false" >> "$GITHUB_OUTPUT"
          fi

          # lint 开关
          if grep -q "enable_lint: true" ci-config.yml; then
            echo "enable_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable_lint=false" >> "$GITHUB_OUTPUT"
          fi

          # contract-test 开关
          if grep -q "enable_contract_test: true" ci-config.yml; then
            echo "enable_contract_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable_contract_test=false" >> "$GITHUB_OUTPUT"
          fi

          # coverage / codecov 开关
          if grep -q "enable_coverage: true" ci-config.yml; then
            echo "enable_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable_coverage=false" >> "$GITHUB_OUTPUT"
          fi

  # 2) Lint（可选）
  lint:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_lint == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: make deps

      - name: Run lint (ruff + black + mypy)
        run: make lint

  # 3) E2E + 覆盖率 + Allure + Codecov（核心）
  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies (make deps)
        run: make deps

      - name: Start backend & frontend (make start-deps)
        run: make start-deps

      - name: Run E2E tests with coverage (make test)
        run: make test

      # 失败时打印日志兜底
      - name: Debug - Print Logs on Failure
        if: failure()
        run: |
          echo "============= BACKEND LOG ============="
          cat backend/backend.log || true
          echo ""
          echo "============= FRONTEND LOG ============="
          cat frontend/frontend.log || true

      # Allure 报告
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # Codecov 上传覆盖率
      - name: Upload coverage to Codecov
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # 需要在仓库 Secrets 里配置
          files: online-reader-demo/coverage.xml
          flags: e2e
          fail_ci_if_error: false

  # 4) API 合同测试（Schemathesis，单独 job，可选）
  contract-test:
    needs: [precheck, test]
    if: ${{ needs.precheck.outputs.enable_contract_test == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (make deps)
        run: make deps

      - name: Ensure backend is running
        run: make start-deps

      - name: Run Schemathesis contract tests (FAST mode)
        run: make contract-test
