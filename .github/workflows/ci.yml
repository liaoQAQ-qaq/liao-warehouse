name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
# --- 👇 新增这段权限声明 👇 ---
permissions:
  contents: write    # 允许写入代码 (推送到 gh-pages 分支)
  pages: write       # 允许部署 GitHub Pages
  id-token: write    # 身份认证所需
# -----------------------------
jobs:
  # ============================
  # 1. 读取配置 & 预检查
  # ============================
  precheck:
    runs-on: ubuntu-latest
    # 这一步不需要进入子目录，只需要检出代码
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Read Configuration
        id: config
        working-directory: online-reader-demo  # 指定读取配置文件的目录
        run: |
          # 简单解析 YAML 里的 enable_unit_test: true/false
          # 如果 grep 到了 true 设为 true，否则 false
          if grep -q "enable_unit_test: true" ci-config.yml; then
            echo "enable_unit_test=true" >> $GITHUB_OUTPUT
          else
            echo "enable_unit_test=false" >> $GITHUB_OUTPUT
          fi
          
          if grep -q "enable_lint: true" ci-config.yml; then
            echo "enable_lint=true" >> $GITHUB_OUTPUT
          else
            echo "enable_lint=false" >> $GITHUB_OUTPUT
          fi

  # ============================
  # 2. 核心测试任务
  # ============================
  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    
    # 全局设定：所有 run 命令默认在 online-reader-demo 目录下执行
    defaults:
      run:
        working-directory: online-reader-demo

    # 启动 MySQL 服务
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reader_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 1. 调用 Makefile 安装依赖
      - name: Install Dependencies (Make deps)
        run: make deps

      # 2. 启动应用 (显式启动，因为这是测试的前置条件)
      - name: Start Backend & Frontend
        run: |
          # 启动后端
          cd backend
          export SQLALCHEMY_DATABASE_URL="mysql+pymysql://root:password@127.0.0.1:3306/reader_db"
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          
          # 启动前端
          cd ../frontend
          nohup npm run dev -- --port 5173 > frontend.log 2>&1 &
          
          # 等待启动
          sleep 10

      # 3. 调用 Makefile 运行测试
      - name: Run Tests (Make test)
        run: make test

      # 4. 生成报告 (无论成功失败)
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results  # 注意路径
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history