name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PROJECT_DIR: online-reader-demo

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
      enable_e2e_test: ${{ steps.config.outputs.enable_e2e_test }}
      enable_contract_test: ${{ steps.config.outputs.enable_contract_test }}
      enable_coverage: ${{ steps.config.outputs.enable_coverage }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Configuration
        id: config
        run: |
          set -e

          read_bool () {
            local key="$1"
            if grep -qE "^${key}:\s*true" ci-config.yml; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          read_bool enable_unit_test
          read_bool enable_lint
          read_bool enable_e2e_test
          read_bool enable_contract_test
          read_bool enable_coverage

  lint:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_lint == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            online-reader-demo/backend/requirements.txt

      - name: Install backend deps only
        run: make deps-backend

      - name: Run lint
        run: make lint

  unit-test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            online-reader-demo/backend/requirements.txt

      - name: Install backend deps only
        run: make deps-backend

      - name: Run unit/API tests with coverage
        run: make unit-test

      - name: Upload coverage to Codecov
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: online-reader-demo/coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: online-reader-demo/coverage.xml

  e2e:
    needs: [precheck, unit-test]
    if: ${{ needs.precheck.outputs.enable_e2e_test == 'true' && (needs.precheck.outputs.enable_unit_test != 'true' || needs.unit-test.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            online-reader-demo/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            online-reader-demo/frontend/package-lock.json

      - name: Install deps (backend + frontend + playwright browsers)
        run: |
          make deps-backend
          make deps-frontend
          python -m playwright install --with-deps chromium

      - name: Start backend & frontend
        run: make start-deps

      - name: Run E2E tests (Allure)
        run: make e2e-test

      - name: Debug - Print Logs on Failure
        if: failure()
        run: |
          echo "============= BACKEND LOG ============="
          tail -n 200 backend/backend.log || true
          echo ""
          echo "============= FRONTEND LOG ============="
          tail -n 200 frontend/frontend.log || true

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Stop services
        if: always()
        run: make stop-deps

  contract-test:
    needs: [precheck, unit-test]
    if: ${{ needs.precheck.outputs.enable_contract_test == 'true' && (needs.precheck.outputs.enable_unit_test != 'true' || needs.unit-test.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            online-reader-demo/backend/requirements.txt

      - name: Install backend deps only
        run: make deps-backend

      - name: Start backend only
        run: |
          make start-backend
          make wait-backend

      - name: Run Schemathesis contract tests (fuzzing only)
        run: make contract-test

      - name: Stop backend
        if: always()
        run: make stop-deps
