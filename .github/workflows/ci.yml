name: 在线阅读项目CI/CD流水线（单人模式）

on:
  push:
    branches:
      - main            # 只要 push 到 main 就自动跑
  workflow_dispatch:    # 可选：可以在 Actions 页面手动点 Run workflow

permissions:
  contents: read

jobs:
  # =========================
  # 1) 自动化测试
  # =========================
  test:
    name: 🤖 自动化测试（online-reader-demo）
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- Python & 后端 ----------
      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装后端和自动化测试依赖（SQLite）
        working-directory: ./online-reader-demo
        run: |
          python -m pip install --upgrade pip

          # 后端依赖：有 requirements.txt 就按文件装，没有就按包名装
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            # 注意：已经去掉 pymysql，因为我们不再用 MySQL
            pip install fastapi uvicorn sqlalchemy python-multipart
          fi

          # 自动化测试相关依赖
          pip install pytest playwright allure-pytest
          playwright install chromium
          playwright install-deps

      - name: 启动后端服务（FastAPI + SQLite）
        working-directory: ./online-reader-demo/backend
        run: |
          # 如果你的项目用环境变量来读取数据库配置，这里显式指定 SQLite 连接
          # 如果你项目里已经写死了 sqlite 的 URL，可以把这一行删掉
          export SQLALCHEMY_DATABASE_URL="sqlite:///./online_reader.db"

          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > ../../backend.log 2>&1 &
          sleep 10

      # ---------- Node & 前端 ----------
      - name: 安装 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装前端依赖
        working-directory: ./online-reader-demo/frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 启动前端服务（Vite）
        working-directory: ./online-reader-demo/frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > ../../frontend.log 2>&1 &
          sleep 10

      # ---------- 运行自动化测试 ----------
      - name: 运行自动化测试用例
        working-directory: ./online-reader-demo
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest autotest_framework/test_cases \
            -c autotest_framework/pytest.ini \
            --alluredir=allure-results

      - name: 上传 Allure 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: online-reader-demo/allure-results

  # =========================
  # 2) 部署（需要人工审核）
  # =========================
  deploy:
    name: 🚀 生产环境部署（需人工审核）
    needs: test                      # 必须等 test 成功
    runs-on: ubuntu-latest
    if: needs.test.result == 'success'

    # 这里绑定 GitHub Settings -> Environments 里新建的环境，比如 Production
    environment:
      name: Production
      url: https://github.com/${{ github.repository }}/deployments

    steps:
      - name: 模拟部署脚本
        run: |
          echo "🎉 测试通过，开始部署 Online Reader ..."
          echo "这里写你真实的部署脚本（ssh 登录服务器、docker pull & restart 等）"
          echo "✅ 部署完成（当前为示意脚本）"
