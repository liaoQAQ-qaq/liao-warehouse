name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================
  # 1. 读取配置 & 预检查
  # ============================
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Read Configuration
        id: config
        working-directory: online-reader-demo
        run: |
          if grep -q "enable_unit_test: true" ci-config.yml; then
            echo "enable_unit_test=true" >> $GITHUB_OUTPUT
          else
            echo "enable_unit_test=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "enable_lint: true" ci-config.yml; then
            echo "enable_lint=true" >> $GITHUB_OUTPUT
          else
            echo "enable_lint=false" >> $GITHUB_OUTPUT
          fi

  # ============================
  # 2. 核心测试任务
  # ============================
  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: online-reader-demo

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reader_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies (Make deps)
        run: make deps

      # --- 👇 修复点 1：前端增加 --host 参数，并增加启动检测 👇 ---
      - name: Start Backend & Frontend
        run: |
          # 启动后端
          cd backend
          export SQLALCHEMY_DATABASE_URL="mysql+pymysql://root:password@127.0.0.1:3306/reader_db"
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          
          # 启动前端 (增加 --host 参数)
          cd ../frontend
          nohup npm run dev -- --port 5173 --host > frontend.log 2>&1 &
          
          echo "正在等待服务启动..."
          sleep 15
          
          echo "检查端口监听状态:"
          netstat -tuln | grep -E '8000|5173' || true

      - name: Run Tests (Make test)
        run: make test

      # --- 👇 修复点 2：如果失败，打印日志让我们看清真相 👇 ---
      - name: Debug - Print Logs on Failure
        if: failure()  # 只有失败时才跑
        run: |
          echo "============= BACKEND LOG ============="
          cat backend/backend.log
          echo ""
          echo "============= FRONTEND LOG ============="
          cat frontend/frontend.log

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history