name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write   # 推 GHCR / 镜像需要

env:
  PROJECT_DIR: online-reader-demo
  BACKEND_PORT: 8000

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
      enable_contract_test: ${{ steps.config.outputs.enable_contract_test }}
      enable_coverage: ${{ steps.config.outputs.enable_coverage }}
      enable_sonar: ${{ steps.config.outputs.enable_sonar }}
      enable_docker: ${{ steps.config.outputs.enable_docker }}
      enable_deploy: ${{ steps.config.outputs.enable_deploy }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Configuration
        id: config
        run: |
          set -e

          read_flag () {
            key="$1"
            if grep -q "${key}: true" ci-config.yml; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          read_flag enable_unit_test
          read_flag enable_lint
          read_flag enable_contract_test
          read_flag enable_coverage
          read_flag enable_sonar
          read_flag enable_docker
          read_flag enable_deploy

  lint:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_lint == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv (Python toolchain)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # 确保 uv 在 PATH 中
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install backend deps
        run: make deps-backend

      - name: Setup team code quality tools
        run: |
          cd .team-code-quality
          make setup

      - name: Run lint
        run: make lint

  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: make deps

      - name: Start backend & frontend
        run: make start-deps

      # 1) 覆盖率：后端 unit-test
      - name: Run Unit/API tests (coverage.xml)
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        run: make unit-test

      # 2) E2E：Allure（不计覆盖率）
      - name: Run E2E tests (Allure)
        run: make e2e-test

      - name: Debug - Print Logs on Failure
        if: failure()
        run: |
          echo "============= BACKEND LOG ============="
          cat backend/backend.log || true
          echo ""
          echo "============= FRONTEND LOG ============="
          cat frontend/frontend.log || true

      # Allure Report -> GH Pages
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # Codecov
      - name: Upload coverage to Codecov
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: online-reader-demo/coverage.xml
          flags: unit
          fail_ci_if_error: false
          verbose: true

      # SonarCloud（你已配置好就打开开关）
      - name: SonarCloud Scan
        if: ${{ needs.precheck.outputs.enable_sonar == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-test:
    needs: [precheck, test]
    if: ${{ needs.precheck.outputs.enable_contract_test == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps (backend only ok)
        run: make deps-backend

      # ✅ 只启动 backend，避免你没装 node/npm 却 make start-deps
      - name: Start backend only (uvicorn)
        run: |
          pkill -f "uvicorn" || true
          PYTHONPATH=. nohup uvicorn backend.main:app --host 0.0.0.0 --port ${{ env.BACKEND_PORT }} > backend/backend.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:${{ env.BACKEND_PORT }}/novels/ || (echo "Backend not ready"; cat backend/backend.log; exit 1)

      - name: Run contract tests
        run: make contract-test

  docker:
    needs: [precheck, test]
    if: ${{ needs.precheck.outputs.enable_docker == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image repo (lowercase)
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${REPO_LC}/online-reader-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (backend)
        uses: docker/build-push-action@v6
        with:
          context: online-reader-demo/backend
          file: online-reader-demo/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}

  deploy:
    needs: [precheck, docker]
    if: ${{ needs.precheck.outputs.enable_deploy == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deploy/online-reader-backend -n default --timeout=120s
