name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write   # 推 GHCR / 镜像需要

env:
  PROJECT_DIR: online-reader-demo
  BACKEND_PORT: 8000
  FRONTEND_PORT: 5173
  DEPLOY_DIR: /opt/online-reader-demo-test   # <<< 你的服务器部署目录（按需改）

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enable_lint: ${{ steps.config.outputs.enable_lint }}
      enable_unit_test: ${{ steps.config.outputs.enable_unit_test }}
      enable_contract_test: ${{ steps.config.outputs.enable_contract_test }}
      enable_coverage: ${{ steps.config.outputs.enable_coverage }}
      enable_sonar: ${{ steps.config.outputs.enable_sonar }}
      enable_docker: ${{ steps.config.outputs.enable_docker }}
      enable_deploy: ${{ steps.config.outputs.enable_deploy }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Configuration
        id: config
        run: |
          set -e

          read_flag () {
            key="$1"
            if grep -q "${key}: true" ci-config.yml; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          read_flag enable_unit_test
          read_flag enable_lint
          read_flag enable_contract_test
          read_flag enable_coverage
          read_flag enable_sonar
          read_flag enable_docker
          read_flag enable_deploy

  lint:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_lint == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv (Python toolchain)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Pre-create team venv with pip (avoid no-pip error in uv venv)
        run: |
          cd .team-code-quality
          python -m venv .venv --upgrade-deps

      - name: Install backend deps
        run: make deps-backend

      - name: Setup team code quality tools
        run: |
          cd .team-code-quality
          make setup

      - name: Run lint
        run: make lint

  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enable_unit_test == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: make deps

      - name: Start backend & frontend
        run: make start-deps

      # 1) 覆盖率：后端 unit-test
      - name: Run Unit/API tests (coverage.xml)
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        run: make unit-test

      # 2) E2E：Allure（不计覆盖率）
      - name: Run E2E tests (Allure)
        run: make e2e-test

      - name: Debug - Print Logs on Failure
        if: failure()
        run: |
          echo "============= BACKEND LOG ============="
          cat backend/backend.log || true
          echo ""
          echo "============= FRONTEND LOG ============="
          cat frontend/frontend.log || true

      # Allure Report -> GH Pages
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: online-reader-demo/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # Codecov
      - name: Upload coverage to Codecov
        if: ${{ needs.precheck.outputs.enable_coverage == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: online-reader-demo/coverage.xml
          flags: unit
          fail_ci_if_error: false
          verbose: true

      # SonarCloud
      - name: SonarCloud Scan
        if: ${{ needs.precheck.outputs.enable_sonar == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-test:
    needs: [precheck, test]
    if: ${{ needs.precheck.outputs.enable_contract_test == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps (backend only ok)
        run: make deps-backend

      - name: Start backend only (uvicorn)
        run: |
          pkill -f "uvicorn" || true
          PYTHONPATH=. nohup uvicorn backend.main:app --host 0.0.0.0 --port ${{ env.BACKEND_PORT }} > backend/backend.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:${{ env.BACKEND_PORT }}/novels/ || (echo "Backend not ready"; cat backend/backend.log; exit 1)

      - name: Run contract tests
        run: make contract-test

  docker:
    needs: [precheck, test]
    if: ${{ needs.precheck.outputs.enable_docker == 'true' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image repos (lowercase)
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO_BACKEND=ghcr.io/${REPO_LC}/online-reader-backend" >> $GITHUB_ENV
          echo "IMAGE_REPO_FRONTEND=ghcr.io/${REPO_LC}/online-reader-frontend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (backend)
        uses: docker/build-push-action@v6
        with:
          context: online-reader-demo/backend
          file: online-reader-demo/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO_BACKEND }}:latest
            ${{ env.IMAGE_REPO_BACKEND }}:${{ github.sha }}

      - name: Build & Push (frontend)
        uses: docker/build-push-action@v6
        with:
          context: online-reader-demo/frontend
          file: online-reader-demo/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO_FRONTEND }}:latest
            ${{ env.IMAGE_REPO_FRONTEND }}:${{ github.sha }}

  deploy:
    needs: [precheck, test, contract-test, docker]
    if: ${{ always() && needs.precheck.outputs.enable_deploy == 'true' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.docker.result == 'success' && (needs.contract-test.result == 'success' || needs.contract-test.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to remote server via SSH
        # 固定到 appleboy/ssh-action 的完整 commit SHA（v1.2.4 对应）
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd "${{ env.DEPLOY_DIR }}"

            echo ">>> docker login ghcr.io"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" --password-stdin

            echo ">>> docker compose pull"
            docker compose pull

            echo ">>> docker compose up -d --remove-orphans"
            docker compose up -d --remove-orphans

            echo ">>> clean old images"
            docker image prune -f
