name: 自动化测试流水线

# 1. 触发规则：当代码推送到 main 分支，或手动点击按钮时触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许你在 GitHub 页面上手动点“运行”按钮

jobs:
  test:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的最新 Ubuntu 服务器
    timeout-minutes: 15     # 设置超时时间，防止脚本卡死耗尽额度

    steps:
    # --- 第一阶段：环境准备 ---
    - name: 拉取代码 (Checkout)
      uses: actions/checkout@v4

    - name: 安装 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # 即使 requirements.txt 里没有，也强制装一下 pytest-html 以防万一
        pip install pytest-html 

    - name: 安装 Playwright 浏览器
      run: |
        playwright install chromium
        playwright install-deps # 安装浏览器需要的系统依赖

    - name: 安装中文字体 (解决截图乱码)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk

    # --- 第二阶段：运行测试 ---
    - name: 运行自动化测试
      run: |
        # 运行测试，生成 html 报告，并把结果存到 report.html
        # 注意：这里我们去掉了 -s，因为 CI 上没人看实时打印，我们看报告就行
        pytest --html=report.html --capture=tee-sys

    # --- 第三阶段：保存结果 ---
    - name: 上传测试结果 (Artifacts)
      # 无论测试成功还是失败，都执行这一步 (if: always)
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: test-results  # 下载时的压缩包名字
        path: |
          report.html
          videos/
          trace.zip
          *.png
        retention-days: 7   # 结果保留 7 天