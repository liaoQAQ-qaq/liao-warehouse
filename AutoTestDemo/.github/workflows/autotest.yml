name: 自动化测试流水线

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # 【核心大招】全局指定工作目录
    # 这句话的意思是：下面所有 run 命令，默认都在 AutoTestDemo 目录下运行！
    # 这样你就再也不用担心找不到 requirements.txt 了
    defaults:
      run:
        working-directory: ./AutoTestDemo

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        # 不需要写 cd 了，因为上面已经配置了 defaults
        pip install -r requirements.txt
        pip install pytest-html

    - name: 安装 Playwright
      run: |
        playwright install chromium
        playwright install-deps

    - name: 安装中文字体
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk

    - name: 运行测试
      run: |
        # 不需要写 cd 了
        pytest --html=report.html --capture=tee-sys

    - name: 上传结果
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        # 注意：这里的 path 依然要写完整路径，因为 upload 插件不受 defaults 影响
        path: |
          AutoTestDemo/report.html
          AutoTestDemo/videos/
          AutoTestDemo/trace.zip
          AutoTestDemo/*.png
        retention-days: 7