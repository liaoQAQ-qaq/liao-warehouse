openapi: 3.0.3
info:
  title: Online Reader API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000

paths:
  /upload/:
    post:
      summary: Upload a novel file
      operationId: uploadNovel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Novel uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelListItem"
        "400":
          description: Unsupported encoding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /novels/:
    get:
      summary: List novels
      operationId: listNovels
      parameters:
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of novels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NovelListItem"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /novels/{novel_id}:
    get:
      summary: Get novel by ID
      operationId: getNovel
      parameters:
        - in: path
          name: novel_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Novel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelDetail"
        "404":
          description: Novel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete novel by ID
      operationId: deleteNovel
      parameters:
        - in: path
          name: novel_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Novel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    NovelListItem:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
        title:
          type: string

    NovelDetail:
      type: object
      required:
        - id
        - title
        - content
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string

    DeleteResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    HTTPValidationError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
