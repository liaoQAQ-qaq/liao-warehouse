name: Auto Test & Deploy (Solo Mode)

on:
  push:
    branches: [ main ]        # 只要你 push 到 main，就自动跑
  workflow_dispatch:          # 可选：手动在 Actions 里点一下一样能跑

jobs:
  # ================================
  # 第一步：自动化测试
  # ================================
  test:
    name: 🤖 自动测试
    runs-on: ubuntu-latest

    # 如果你确实需要 MySQL，就保留；不需要可以先删掉这段 services
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reader_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pymysql python-multipart pytest playwright allure-pytest
          playwright install chromium
          playwright install-deps

      - name: Start backend
        run: |
          cd backend
          export SQLALCHEMY_DATABASE_URL="mysql+pymysql://root:password@127.0.0.1:3306/reader_db"
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          sleep 5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Start frontend
        run: |
          cd frontend
          npm install
          nohup npm run dev -- --port 5173 > frontend.log 2>&1 &
          sleep 5

      - name: Run autotests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python -m pytest autotest_framework/test_cases/ --alluredir=allure-results

      # 可选：把测试结果打包成构件，至少你在 Actions 里能下载回来看看
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  # ================================
  # 第二步：人工审核后部署
  # ================================
  deploy:
    name: 🚀 部署到生产
    needs: test                 # 必须等 test 成功
    runs-on: ubuntu-latest

    # 这里绑定 Environment，用于“人工点一下再执行”
    environment:
      name: Production
      url: https://github.com/${{ github.repository }}/deployments

    steps:
      - name: Mock deploy
        run: |
          echo "🎉 测试通过，开始部署..."
          echo "（这里写你自己的部署脚本，比如 ssh 到服务器、docker pull & restart 等）"
          echo "✅ 部署完成"
